```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

@font-face {
    font-family: 'Cutie Patootie';
    src: url('./CutiePatootie.ttf') format('truetype');
}

body{
    margin:0;
    padding:0;
    background:transparent;
}

#contain_moon{
    text-align:center;
    padding:10px;
    font-family:'Cutie Patootie', cursive;
}

#moon_phase{
    margin-top:8px;
    font-size:20px;
    color:#8B7EC8;
    letter-spacing:1px;
}

#moon_image{
    padding:20px;
    filter:drop-shadow(0 0 20px rgba(120,120,255,.25));
}

</style>
</head>

<body>

<div id="contain_moon">

    <div id="moon_image"></div>

    <div id="moon_phase"></div>

</div>

<script>

(function(){

    const today = new Date().getDate();

    const moonImage = document.getElementById("moon_image");
    const moonPhase = document.getElementById("moon_phase");

    const request = new XMLHttpRequest();

    const url =
    "https://www.icalendar37.net/lunar/api/" +
    "?lang=pt" +
    "&month=" + (new Date().getMonth()+1) +
    "&year=" + new Date().getFullYear() +
    "&size=120" +
    "&lightColor=rgb(245,245,245)" +
    "&shadeColor=rgb(17,17,17)" +
    "&t" +
    "&LDZ=" +
    new Date(
        new Date().getFullYear(),
        new Date().getMonth(),
        1
    )/1000;

    request.onreadystatechange = function(){

        if(request.readyState === 4 && request.status === 200){

            const data = JSON.parse(request.responseText);

            moonImage.innerHTML = data.phase[today].svg;

            let phaseText = data.phase[today].npWidget;

            phaseText = phaseText
                .replace("Waxing", "Crescente")
                .replace("Waning", "Minguante")
                .replace("Full Moon", "Lua Cheia")
                .replace("New Moon", "Lua Nova")
                .replace("First Quarter", "Quarto Crescente")
                .replace("Last Quarter", "Quarto Minguante");

            moonPhase.innerHTML = phaseText;
        }
    };

    request.open("GET", url, true);
    request.send();

})();

</script>

</body>
</html>
```
